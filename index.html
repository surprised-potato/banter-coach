<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banter Coach</title>
<style>
:root{--bg:#0e0f14;--panel:#171922;--panel2:#1f2230;--ink:#eceef6;--mut:#8b90a6;--line:#2a2e40;--me:#ff4f8b;--them:#2b2f42;--pass:#35d49a;--weak:#ffb84d;--dead:#ff5d5d;--acc:#ff4f8b}
@media (prefers-color-scheme:light){:root{--bg:#f3f4f8;--panel:#fff;--panel2:#f0f1f6;--ink:#161824;--mut:#666b80;--line:#dde0ea;--them:#e6e8f0}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--mut);white-space:nowrap}
button.pill{cursor:pointer}
.xp{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-bottom:10px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ffb84d);width:0;transition:width .5s}
main{flex:1;overflow:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;display:block;width:100%;text-align:left}
.card.hero{border:1px solid var(--acc);background:linear-gradient(135deg,rgba(255,79,139,.14),var(--panel) 60%)}
.k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.stage{display:flex;gap:12px;align-items:center}
.stage.lock{opacity:.45;cursor:not-allowed}
.stage b{display:block}.stage small{color:var(--mut)}
.num{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-weight:700;flex:none}
.bar{height:5px;background:var(--panel2);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pass)}
.chat{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.b{max-width:82%;padding:9px 13px;border-radius:18px;word-wrap:break-word;animation:pop .25s}
.b.them{background:var(--them);align-self:flex-start;border-bottom-left-radius:5px}
.b.me{background:var(--me);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.b.typing{color:var(--mut)}
#helpbox .card{margin-bottom:8px;max-height:40dvh;overflow:auto}
.ex{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.ex small{display:block;color:var(--acc);font-weight:600;font-size:12px}
.ctx{align-self:center;text-align:center;font-size:13px;color:var(--mut);background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:6px 12px;max-width:92%}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.note{font-size:13px;color:var(--mut);margin:4px 0 8px}
.verdict{border-left:5px solid var(--mut)}
.verdict.Pass{border-left-color:var(--pass)}.verdict.Weak{border-left-color:var(--weak)}.verdict.DeadEnd{border-left-color:var(--dead)}
.vh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.vh b{font-size:20px}.Pass .vh b{color:var(--pass)}.Weak .vh b{color:var(--weak)}.DeadEnd .vh b{color:var(--dead)}
.rw{background:var(--panel2);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.chips span,.tag{display:inline-block;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:6px 4px 0 0;color:var(--mut)}
.tag.boss{background:#5a1f3a;color:#ffd0e2;border-color:#5a1f3a}
.tag.gen{background:#1f3a5a;color:#d0e6ff;border-color:#1f3a5a}
footer{padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea,input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;min-width:0}
textarea{flex:1;resize:none;max-height:110px}
input{width:100%;margin:6px 0 10px}
.err{color:var(--dead)}
.drow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;flex:1;min-width:0}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.tc b{display:block;font-size:14px}.tc small{display:block;color:var(--mut);margin-top:2px}
.tc .tx{font-style:italic;margin-top:4px}.tc .tm{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.tc.mastered{border-color:var(--pass)}.tc.mastered b{color:var(--pass)}.tc.tried{border-color:var(--weak)}
.tc.lock{opacity:.45;cursor:not-allowed}
.tag.ch{background:#3a2f12;color:#ffe2a8;border-color:#3a2f12}
@media (max-width:380px){.deck{grid-template-columns:1fr}}
.sk{display:grid;grid-template-columns:110px 1fr 38px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.sk .bar{margin:0;height:8px}.sk .bar i{background:var(--acc)}
.sk em{font-style:normal;color:var(--mut);text-align:right}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:22px}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
details summary::-webkit-details-marker{display:none}
.v{font-weight:700;font-size:13px;flex:none;width:62px}.v.Pass{color:var(--pass)}.v.Weak{color:var(--weak)}.v.DeadEnd{color:var(--dead)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
svg.spark{width:100%;height:64px;display:block}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl">Banter Coach</h1><span class="pill" id="streak"></span><span class="pill" id="lvl"></span><button class="pill" id="who" hidden></button></header>
  <div class="xp"><i id="xp"></i></div>
  <main id="main"></main>
  <footer id="foot" hidden>
    <div id="helpbox"></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" id="hlp" title="Show coach help" aria-label="Show coach help">💡</button><textarea id="inp" rows="1" maxlength="300" placeholder="Type your reply…"></textarea><button class="btn" id="send">Send</button></div>
  </footer>
</div>
<script>
'use strict';
/* ---------- config / storage ---------- */
const qs=new URLSearchParams(location.search);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
if(qs.get('api'))ls.set('bc_api',qs.get('api'));
const API=ls.get('bc_api')||'https://notified-tenant-cyber-sunny.trycloudflare.com';
const NEED=3;

/* ---------- content ---------- */
// each core text: [text, trap it baits, context]
const STAGES=[
 {n:1,name:'The Pivot',sub:'Stop agreeing, advising, interviewing. Tease, exaggerate.',
  rules:'No safe small talk, no interview questions, no tips, no "same".',
  sc:[['Honestly just surviving on iced coffee and spreadsheets at this point lol','advice','You matched two days ago, swapped a couple of basic texts, and just asked how their week is going.'],
   ['Nothing crazy, probably just going to rot on my couch and rewatch The Office for the millionth time','agreeing',"You've been texting casually for a day and asked what they're up to tonight."],
   ['Attempted homemade pasta from scratch and honestly my kitchen looks like a crime scene right now','thirsty',"You're chatting about weekend plans. They said they're getting back into cooking, so you asked what they're making."],
   ['Woke up at noon and currently debating if cereal counts as a real lunch','agreeing',"It's Sunday. You asked how their morning is going."],
   ['Just got back from the gym, my legs are jelly','interviewing','You matched yesterday and texted "how\'s your day going?" an hour ago.'],
   ['Binge-watching a baking show instead of doing laundry','advice',"It's Friday night, a few days into texting. You asked what they're up to."],
   ['I need like three alarms to get up in the morning, it\'s embarrassing','agreeing',"You mentioned you're an early riser. This is their reply."],
   ['My dog just stole my sandwich off the counter and he is not sorry','interviewing','Their profile is full of photos of their golden retriever. You asked how lunch was.'],
   ['wow so you\'re one of those people who replies instantly huh','agreeing','You replied to their message within a minute. They tease you first.'],
   ['haha nice','interviewing','You sent a long story about your neighbour\'s rooster waking you up at 4am. This is all they sent back.'],
   ['so what do you do for work?','too literal','You matched yesterday and have been chatting about weekend plans. They ask you a question.'],
   ['you probably say that to everyone lol','clunky','You told them their profile was the funniest one you\'ve seen this week.']],
  boss:'I swear I\'m a great cook, I just burn everything. Last night was a smoke alarm situation',bossCtx:'A few days in, you asked if they cook.'},
 {n:2,name:'The Frame',sub:'Create "us" energy: hypotheticals, compatibility tests, specific compliments.',
  rules:'Put the two of you in a scenario. Be specific. No generic "you\'re so pretty".',
  sc:[['I\'m the type who always has a playlist for every mood lol','interviewing',"The banter's been good for a few days. You mentioned your commute playlist is all 2000s pop."],
   ['Planning a trip to Japan next year, I have 47 tabs open','advice','You asked if they have any trips coming up.'],
   ['I\'m weirdly competitive at board games, fair warning','too literal','You mentioned your friends have a game night this weekend.'],
   ['Honestly I\'d live on tacos if I could','agreeing','You asked about their go-to comfort food.'],
   ['I always get the window seat on planes, non-negotiable','interviewing',"You've been comparing travel habits."],
   ['I\'m the friend who gets everyone lost on road trips','advice','You said road trips are your favourite kind of holiday.'],
   ['ok your taste in music is actually elite, i\'m impressed','agreeing','You sent them a song from your road-trip playlist. They compliment you.'],
   ['lol','interviewing','You\'ve been texting for a few days and just joked that pineapple pizza is a personality test. This is all they sent.'],
   ['so are you a morning person or a night owl','too literal','You\'ve been comparing habits for a few days. They ask you a question.'],
   ['i bet you\'re the friend who always cancels plans last minute','clunky','You mentioned you love making plans with friends. They tease you first.']],
  boss:'Okay settle this: pineapple on pizza, yes or no? Be careful, I\'m judging you',bossCtx:"You've been teasing each other about food opinions all week."},
 {n:3,name:'The Close',sub:'Turn banter into a confident, low-pressure invitation.',
  rules:'Specific, easy to say yes to, not hesitant, not needy. Say something they can answer.',
  sc:[['lol okay you\'re funny. we\'ve been texting for a week and I still don\'t know what you look like in 3D','thirsty',"You've texted every day for a week and the banter has been great, but you haven't met yet."],
   ['I\'ve been craving a really good taco all day and nobody here knows where to go','advice',"Earlier you joked that you're a self-appointed taco expert."],
   ['This thread is the best part of my day, no pressure lol','clunky',"You've had a long, fun back-and-forth all afternoon."],
   ['Ugh I need to get out of the house this weekend. Any ideas?','advice',"It's Thursday. You've been texting for about a week."],
   ['That coffee place you mentioned sounds amazing','interviewing','Yesterday you mentioned a coffee spot you love near your work.'],
   ['We should probably stop texting and just prove we\'re this funny in real life','try-hard',"You've been roasting each other for an hour."],
   ['haha you\'re trouble','try-hard','A week of good banter. You just joked about stealing their fries if you ever ate together.'],
   ['so when are you going to stop bragging about that taco place and actually prove it','hesitant','You keep bragging that you know the best taco place in town. They call you on it.'],
   ['honestly i\'m free saturday, just saying','hesitant','A week of texting. You mentioned wanting to try the new bowling alley downtown.'],
   ['haha ok','hesitant','You\'ve been texting for a week. You just asked if they\'ve ever been to the night market.']],
  boss:'Okay the banter is strong. Now I\'m curious if you\'re this good in person',bossCtx:'A week of strong banter. They just sent this.'}
];
const HINTS={1:'Accuse them of something absurd. Exaggerate. Flip the blame.',2:'Drop both of you into a tiny scenario ("we\'d…").',3:'Name a place and a time, keep it light.'};
const SKILLS=[
 {id:'tease',name:'Teasing',flags:['agreeing','too literal','pun only'],why:'agreed, punned or answered literally'},
 {id:'noint',name:'No interviews',flags:['interviewing'],why:'asked interview questions'},
 {id:'noadv',name:'No advice',flags:['advice'],why:'gave advice'},
 {id:'cal',name:'Calibration',flags:['thirsty','try-hard'],why:'came on too strong or tried too hard'},
 {id:'conf',name:'Confidence',flags:['bailed','clunky','borrowed','hesitant'],why:'bailed, hedged, got clunky or borrowed the coach\'s lines'},
 {id:'fresh',name:'Freshness',flags:['repetitive','stale'],why:'repeated the same move or used a worn-out template'}];
const skillOf=f=>SKILLS.find(s=>s.flags.includes(f));
let TECHS=[];  // technique library, loaded from /techniques
const techName=id=>(TECHS.find(t=>t.id===id)||{}).name||id;
const MASTER=3; // passes with a technique to master it
function techStats(){
  return TECHS.map(t=>{const a=A.filter(x=>x.technique===t.id);const p=a.filter(x=>x.verdict==='Pass').length;
    return{...t,used:a.length,passes:p,status:p>=MASTER?'mastered':a.length?'tried':'unseen',locked:!unlocked(t.stage)}});
}
function rangeScore(){const r=A.slice(0,15);if(r.length<3)return null;const d=new Set(r.filter(a=>a.verdict==='Pass'&&a.technique&&a.technique!=='none').map(a=>a.technique));return Math.min(100,Math.round(d.size/6*100))}

/* ---------- state ---------- */
let TOKEN=ls.get('bc_token'),NAME=ls.get('bc_name'),P=null,A=[];   // progress, attempts (newest first)
const newP=()=>({xp:0,streak:0,best:0,tries:0,passes:0,passed:{1:[],2:[],3:[]},rally:{}});
function loadGuest(){loadGuestDrills();try{const g=JSON.parse(ls.get('bc_guest'));if(g&&g.P){P=g.P;A=g.A||[];return}}catch(e){}P=newP();A=[]}
function saveGuest(){if(!TOKEN)ls.set('bc_guest',JSON.stringify({P,A:A.slice(0,200)}))}
const passedOf=n=>P.passed[n]||P.passed[String(n)]||[];
const unlocked=n=>n===1||!!P.rally[n-1];
function applyAttempt(stage,key,verdict){ // mirrors server apply_attempt (guest mode)
  P.tries++;
  if(verdict==='Pass'){P.passes++;P.streak++;P.best=Math.max(P.best,P.streak);P.xp+=10+Math.min(P.streak,5)*2;const l=P.passed[stage]=passedOf(stage);if(key&&!l.includes(key))l.push(key)}
  else{P.streak=0;P.xp+=2}
}
const rallyScore=v=>{const ps=v.filter(x=>x==='Pass').length,fs=v.length-ps;return{ps,fs,win:ps>=3||(v.length>=4&&fs<2&&ps>=2),over:ps>=3||fs>=2||v.length>=4}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const main=$('#main'),foot=$('#foot'),inp=$('#inp'),send=$('#send');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const level=()=>1+Math.floor(P.xp/100);
function hud(){
  const on=!!P;$('#streak').hidden=$('#lvl').hidden=!on;
  if(on){$('#streak').textContent='🔥 '+P.streak;$('#lvl').textContent='Lv '+level();$('#xp').style.width=(P.xp%100)+'%'}
  const w=$('#who');w.hidden=!on;w.textContent=TOKEN?'👤 '+NAME:'👤 Guest';
}
async function api(path,body,method){
  const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  const r=await fetch(API+path,{method:method||(body?'POST':'GET'),headers:h,body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&TOKEN&&path!=='/login'){logout(true);throw new Error('session expired, log in again')}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const coreKey=(n,i)=>'s'+n+'-'+i;
function scen(n,i){const c=STAGES[n-1].sc[i];return{stage:n,key:coreKey(n,i),text:c[0],trap:c[1],ctx:c[2]}}

/* ---------- analytics (shared by home + stats) ---------- */
function mastery(){
  const recent=A.slice(0,10);
  return SKILLS.map(s=>{
    if(recent.length<3)return{...s,m:null,hits:0};
    let t=0,hits=0;for(const a of recent){const bad=(a.flags||[]).some(f=>s.flags.includes(f));if(bad)hits++;t+=bad?0:a.verdict==='Pass'?100:60}
    return{...s,m:Math.round(t/recent.length),hits};
  }).concat(TECHS.length?[{id:'range',name:'Range',flags:[],m:rangeScore(),hits:0}]:[]);
}
function randText(n){const sc=STAGES[n-1].sc,un=sc.map((s,i)=>i).filter(i=>!passedOf(n).includes(coreKey(n,i)));const pool=un.length?un:sc.map((s,i)=>i);return scen(n,pool[Math.floor(Math.random()*pool.length)])}
function challengeFor(id){const t=TECHS.find(x=>x.id===id),top=[3,2,1].find(unlocked);const n=t.stage>1?t.stage:Math.min(top,2);return{...randText(n),challenge:id}}
function stuckTechnique(){ // same technique in 3+ of the last 8 passes?
  const c={};A.filter(a=>a.verdict==='Pass'&&!a.rally_id&&a.technique&&a.technique!=='none').slice(0,8).forEach(a=>c[a.technique]=(c[a.technique]||0)+1);
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return top&&top[1]>=3?top[0]:null;
}
function nextDrill(){
  const top=[3,2,1].find(unlocked);
  // 1. rally ready?
  for(const n of [1,2,3])if(unlocked(n)&&!P.rally[n]&&passedOf(n).length>=NEED)return{type:'rally',stage:n,reason:`You have ${NEED} passes in Stage ${n}. Beat the rally to unlock the next stage.`};
  // 2. stuck on one technique? challenge a new one
  const stuck=TECHS.length&&stuckTechnique();
  if(stuck){
    const opts=techStats().filter(t=>!t.locked&&t.status!=='mastered'&&t.id!==stuck),fresh=opts.filter(t=>t.status==='unseen'),pick=(fresh.length?fresh:opts)[Math.floor(Math.random()*(fresh.length||opts.length))];
    if(pick)return{type:'core',s:challengeFor(pick.id),reason:`You keep reaching for ${techName(stuck)}. Try ${pick.name}: ${pick.how}`};
  }
  const ms=mastery().filter(s=>s.m!==null&&s.flags.length).sort((a,b)=>a.m-b.m);
  const weak=ms.length&&ms[0].m<85?ms[0]:null;
  const st=STAGES[top-1];
  const unpassed=st.sc.map((s,i)=>i).filter(i=>!passedOf(top).includes(coreKey(top,i)));
  if(weak){
    const dd=DRILLS.find(x=>!x.cleared&&weak.flags.includes(x.habit));
    if(dd)return{type:'drill',d:dd,reason:`${weak.name} is your weakest skill, and your saved drill "${dd.title}" targets it.`};
    const recent6=A.slice(0,6),cnt=recent6.filter(a=>(a.flags||[]).some(f=>weak.flags.includes(f))).length;
    const why=cnt?`You ${weak.why} in ${cnt} of your last ${recent6.length} replies.`:`${weak.name} is your weakest skill (${weak.m}).`;
    const i=unpassed.find(i=>weak.flags.includes(st.sc[i][1]));
    if(i!==undefined)return{type:'core',s:scen(top,i),reason:why+' This one baits exactly that.'};
    // oldest failed core text with that trap, any unlocked stage
    const failed=A.slice().reverse().find(a=>a.verdict!=='Pass'&&/^s\d-\d+$/.test(a.scenario_key||'')&&!a.rally_id&&unlocked(a.stage)&&!passedOf(a.stage).includes(a.scenario_key));
    if(failed){const [n,i2]=failed.scenario_key.slice(1).split('-').map(Number);if(STAGES[n-1]?.sc[i2])return{type:'core',s:scen(n,i2),reason:why+' Retry one you missed.'}}
    return{type:'gen',stage:top,trap:weak.flags[0],reason:why+' Here\'s a fresh text that baits it.'};
  }
  if(unpassed.length)return{type:'core',s:scen(top,unpassed[0]),reason:A.length?'Keep going in Stage '+top+'.':'Start here: your first text.'};
  return{type:'gen',stage:top,trap:STAGES[top-1].sc[0][1],reason:'You\'ve passed every core text here. Fresh one incoming.'};
}

/* ---------- router ---------- */
let cur=null;
function go(h){if(location.hash===h)route();else location.hash=h}
window.addEventListener('hashchange',route);
function route(){
  const h=location.hash||'#home';
  if(cur&&h!=='#play'){cur=null}
  if(!P){return login()}
  if(h==='#play'&&!cur)return go('#home');
  if(h==='#play')return;
  foot.hidden=true;
  if(h.startsWith('#stage/')){const n=+h.split('/')[1];return unlocked(n)?stageView(n):go('#home')}
  if(h==='#stats')return stats();
  if(h==='#login')return login();
  home();
}

/* ---------- login ---------- */
function login(msg){
  foot.hidden=true;$('#ttl').textContent='Banter Coach';hud();
  main.innerHTML=`<div class="card"><p style="margin-top:0">A blunt coach grades your texts. Earn passes, beat the rally, advance.</p>
  <label class="k" for="nm">Name</label><input id="nm" maxlength="24" autocomplete="username" value="${esc(NAME||'')}">
  <label class="k" for="pn">PIN (4-6 digits)</label><input id="pn" inputmode="numeric" type="password" maxlength="6" autocomplete="current-password">
  <div class="row"><button class="btn" id="li">Log in</button><button class="btn ghost" id="su">Create profile</button></div>
  <p class="note err" id="lerr">${esc(msg||'')}</p></div>
  <button class="btn ghost" id="gst">Play as guest</button><p class="note">Guest progress stays in this browser only. Profiles sync across devices.</p>
  <p class="note">Coach server: <span id="srv">checking…</span></p>`;

function checkSrv(){fetch(API+'/health').then(r=>r.json()).then(()=>{const s=$('#srv');if(s)s.textContent='online ✓'}).catch(()=>{const s=$('#srv');if(s)s.innerHTML='<span class="err">offline: the host machine is asleep or LM Studio is off</span>'})}
function logout(expired){if(TOKEN)fetch(API+'/logout',{method:'POST',headers:{Authorization:'Bearer '+TOKEN}}).catch(()=>{});TOKEN=null;ls.del('bc_token');P=null;A=[];cur=null;hud();if(location.hash!=='#login')location.hash='#login';login(expired?'Session expired. Log in again.':'')}
async function refresh(){if(!TOKEN)return;const j=await api('/me');P=j.progress;A=j.attempts;NAME=j.name;try{DRILLS=(await api('/drills')).drills}catch(e){DRILLS=[]}}

function topHabits(){const c={};A.slice(0,60).forEach(a=>(a.flags||[]).forEach(f=>c[f]=(c[f]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6)}

const skillRow=s=>`<div class="sk"><span>${s.name}</span><div class="bar"><i style="width:${s.m??0}%"></i></div><em>${s.m??'–'}</em></div>`;

function drillText(){

async function drillTurn(verdict){
  const d=cur.drill;cur.dv.push(verdict);const ps=cur.dv.filter(v=>v==='Pass').length;
  if(cur.di<d.texts.length-1){
    $('#res').insertAdjacentHTML('beforeend',`<div class="card"><b>${ps} pass${ps==1?'':'es'} so far</b> (need ${d.pass_need} of ${d.texts.length}).<div class="row" style="margin-top:10px"><button class="btn" id="dnx">Next text →</button></div></div>`);
    $('#dnx').onclick=()=>{cur.di++;drillText()};foot.hidden=true;main.scrollTop=main.scrollHeight;return;
  }
  foot.hidden=true;let out=null;
  if(TOKEN&&d.saved){try{out=await api('/drill/result',{id:d.id,run:cur.run})}catch(e){}}
  else{const runs=(d.runs||0)+1,best=Math.max(d.best||0,ps),cleared=d.cleared||ps>=d.pass_need;out={...d,runs,best,cleared}}
  if(out){const k=DRILLS.findIndex(x=>x.id===d.id);if(k>=0){DRILLS[k]={...DRILLS[k],runs:out.runs,best:out.best,cleared:out.cleared};saveGuestDrills()}}

function deckCard(){
  if(!TECHS.length)return '';
  const ts=techStats(),m=ts.filter(t=>t.status==='mastered').length;
  return `<div class="card"><div class="k">Technique deck · ${m}/${ts.length} mastered</div><p class="note">Pass ${MASTER}× with a technique to master it. Tap one to practise it.</p><div class="deck">${ts.map(t=>`<button class="tc ${t.status} ${t.locked?'lock':''}" ${t.locked?'disabled':''} data-t="${t.id}"><b>${t.status==='mastered'?'★ ':''}${esc(t.name)}</b><small>${t.locked?'Unlocks in Stage '+t.stage:esc(t.how)}</small>${!t.locked&&t.status==='unseen'?`<small class="tx">${esc(t.ex[0])}</small>`:''}<span class="tm">${t.passes}/${MASTER} passes · used ${t.used}</span></button>`).join('')}</div></div>`;
}

  $('#ttl').textContent='Stats';hud();

  <div class="card"><div class="k">Pass rate by stage</div><div class="grid3" style="margin-top:6px">${[1,2,3].map(n=>`<div><b>${pr(n)}</b><small class="note">Stage ${n}</small></div>`).join('')}</div></div>
  <div class="card"><div class="k">Score trend</div>${spark}</div>

  ${deckCard()}
  <div class="card"><div class="k">Your top habits</div>${habits.length?habits.map(([f,o])=>`<p style="margin:8px 0 0"><b>${esc(f)}</b> ×${o.n}<br><small class="note">e.g. "${esc(o.ex)}"</small></p>`).join(''):'<p class="note">None yet. Suspicious.</p>'}</div>
  <div class="card"><div class="k">History</div>${A.length?A.slice(0,50).map(a=>`<details><summary><span class="v ${a.verdict.replace(' ','')}">${esc(a.verdict)}</span><span class="ell">${esc(a.reply)}</span><small class="note">${a.score}</small></summary><p class="note" style="margin:6px 0">${a.rally_id?'<span class="tag boss">rally</span>':''}${(a.scenario_key||'').startsWith('gen:')?'<span class="tag gen">fresh</span>':''}${a.technique&&a.technique!=='none'?'<span class="tag">'+esc(techName(a.technique))+'</span>':''} Them: "${esc(a.them_text)}"</p><div style="font-size:14px">${esc(a.diagnosis)}</div><div class="chips">${(a.flags||[]).map(f=>`<span>${esc(f)}</span>`).join('')}</div><small class="note">${new Date(a.ts*1000).toLocaleString()}</small></details>`).join(''):'<p class="note">No attempts yet.</p>'}</div>

/* ---------- play ---------- */
function ctxLine(t){if(!t)return;const d=document.createElement('div');d.className='ctx';d.textContent='📍 '+t;$('#chat').appendChild(d)}
function bubble(who,t,cls=''){const d=document.createElement('div');d.className='b '+who+' '+cls;d.textContent=t;$('#chat').appendChild(d);main.scrollTop=main.scrollHeight;return d}
function shell(title,tags){
  $('#ttl').textContent=title;foot.hidden=false;hud();
  $('#helpbox').innerHTML='';
  main.innerHTML=`<div class="note">${tags}<button class="btn ghost sm" id="exit" style="float:right">Exit</button></div><div class="chat" id="chat"></div><div id="res"></div>`;
  inp.placeholder='Type your reply…';
  $('#exit').onclick=()=>{const n=cur.stage,dr=cur.drill;cur=null;dr?go('#home'):go('#stage/'+n)};inp.value='';inp.focus();

}
function play(s){
  cur={...s,thread:[{who:'them',t:s.text}],boss:false,busy:false};
  const ct=s.challenge&&TECHS.find(t=>t.id===s.challenge);
  shell('Stage '+s.stage,`<span class="tag">Stage ${s.stage}</span>${s.key.startsWith('gen:')?'<span class="tag gen">fresh</span>':''}${ct?`<span class="tag ch">🎯 Use: ${esc(ct.name)}</span> ${esc(ct.how)}`:esc(STAGES[s.stage-1].rules)}`);
  ctxLine(s.ctx);bubble('them',s.text);
}
async function playGen(n,trap){
  cur={stage:n,busy:true,thread:[]};
  shell('Stage '+n,'<span class="tag gen">fresh</span>Writing a new text…');foot.hidden=true;
  const ty=bubble('them','…','typing');
  try{const j=await api('/generate',{stage:n,trap:trap||STAGES[n-1].sc[Math.floor(Math.random()*STAGES[n-1].sc.length)][1]});ty.remove();play({stage:n,key:j.key,text:j.text,trap:j.trap,ctx:j.context})}
  catch(e){ty.remove();$('#res').innerHTML=`<div class="card err">Couldn't get a fresh text (${esc(e.message)}).</div>`}
}
function rally(n){
  const st=STAGES[n-1];
  cur={stage:n,key:'rally'+n,ctx:st.bossCtx,thread:[{who:'them',t:st.boss}],boss:true,rid:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),v:[],busy:false};
  shell('Rally · '+st.name,'<span class="tag boss">BOSS</span>4 texts. Keep the bit alive.');
  ctxLine(st.bossCtx);bubble('them',st.boss);

async function submit(){
  const t=inp.value.trim();if(!t||!cur||cur.busy)return;
  cur.busy=true;send.disabled=true;inp.value='';$('#res').innerHTML='';
  bubble('me',t);
  const ty=bubble('them','coach is reading…','typing');
  try{
    const j=await api('/judge',{stage:cur.stage,key:cur.key,context:cur.ctx,help_shown:cur.help||[],challenge:cur.challenge,recent:A.slice(0,6).map(a=>a.reply),thread:cur.thread,reply:t,rally:cur.boss,rally_id:cur.boss?cur.rid:undefined,drill_run:cur.drill?cur.run:undefined,drill_rule:cur.drill&&!TOKEN?cur.drill.rule:undefined,drill_principle:cur.drill&&!TOKEN?cur.drill.principle:undefined});
    cur.thread.push({who:'me',t});ty.remove();$('#helpbox').innerHTML='';cur.help=[];
    const rec={ts:Date.now()/1000,stage:cur.stage,scenario_key:cur.key,them_text:[...cur.thread].reverse().find(m=>m.who==='them').t,reply:t,verdict:j.verdict,score:j.score,flags:j.flags,diagnosis:j.diagnosis,rally_id:cur.boss?cur.rid:null,technique:j.technique,challenge:cur.challenge||null};
    A.unshift(rec);
    if(j.progress)P=j.progress;else{applyAttempt(cur.stage,(cur.boss||cur.drill)?null:cur.key,j.verdict);saveGuest()}
    card(j);hud();
    if(cur.boss)await bossTurn(j.verdict);else if(cur.drill)await drillTurn(j.verdict);else plainTurn(j.verdict==='Pass');
  }catch(e){
    ty.remove();inp.value=t;$('#chat').lastChild.remove();
    $('#res').innerHTML=`<div class="card err">Couldn't reach the coach (${esc(e.message)}). The host machine may be offline. Try again.</div>`;
  }
  if(cur){cur.busy=false}send.disabled=false;inp.focus();
}
function card(j){
  const k=j.verdict.replace(' ','');
  $('#res').insertAdjacentHTML('beforeend',`<div class="card verdict ${k}"><div class="vh"><b>${esc(j.verdict)}</b><span class="note">${j.technique&&j.technique!=='none'?esc(techName(j.technique))+' · ':''}${j.score}/100</span></div><div>${esc(j.diagnosis)}</div>${(j.rewrites||[]).map(r=>typeof r==='string'?`<div class="rw">💡 ${esc(r)}</div>`:`<div class="rw"><small class="k">${esc(r.technique)}</small><br>💡 ${esc(r.line)}</div>`).join('')}<div class="chips">${(j.flags||[]).map(f=>`<span>${esc(f)}</span>`).join('')}</div></div>`);
  main.scrollTop=main.scrollHeight;
}
function plainTurn(pass){
  const n=cur.stage;
  if(pass){
    const left=Math.max(0,NEED-passedOf(n).length);
    $('#res').insertAdjacentHTML('beforeend',`<div class="card"><b>Passed.</b> ${P.rally[n]?'':left?left+' more pass'+(left>1?'es':'')+' to unlock the rally.':'Rally unlocked!'}<div class="row" style="margin-top:10px"><button class="btn" id="nx">Next drill</button><button class="btn ghost" id="fr">Fresh text</button><button class="btn ghost" id="bk">Stage</button></div></div>`);
    $('#nx').onclick=()=>{cur=null;go('#home')};$('#fr').onclick=()=>playGen(n);$('#bk').onclick=()=>{cur=null;go('#stage/'+n)};
    foot.hidden=true;
  }else{
    $('#res').insertAdjacentHTML('beforeend',`<div class="note">Retry the same text. ${HINTS[n]}</div>`);
    cur.thread=cur.thread.slice(0,1);
    document.querySelectorAll('.b.me').forEach(b=>b.style.opacity=.45);
  }
  main.scrollTop=main.scrollHeight;
}
async function bossTurn(verdict){
  cur.v.push(verdict);const n=cur.stage,r=rallyScore(cur.v);
  if(r.over){
    foot.hidden=true;let win=r.win;
    if(TOKEN){try{const j=await api('/rally_result',{stage:n,rally_id:cur.rid});P=j.progress;win=j.win}catch(e){}}
    else if(win&&passedOf(n).length>=NEED&&!P.rally[n]){P.rally[n]=true;P.xp+=40;saveGuest()}
    hud();
    $('#res').insertAdjacentHTML('beforeend',`<div class="card"><b>${win?'Rally won. '+(n<3?'Stage '+(n+1)+' unlocked.':'You finished the course.'):'Rally lost.'}</b> ${r.ps} pass${r.ps==1?'':'es'}, ${r.fs} miss${r.fs==1?'':'es'}.<div class="row" style="margin-top:10px">${win?'':'<button class="btn" id="rt">Try again</button>'}<button class="btn ghost" id="bk">Home</button></div></div>`);
    if(!win)$('#rt').onclick=()=>rally(n);$('#bk').onclick=()=>{cur=null;go('#home')};
    return;
  }
  const ty=bubble('them','…','typing');
  try{const j=await api('/reply',{thread:cur.thread,context:cur.ctx});ty.remove();cur.thread.push({who:'them',t:j.text});bubble('them',j.text)}
  catch(e){ty.remove();bubble('them','(lost signal)')}
  $('#res').insertAdjacentHTML('beforeend',`<div class="note">Turn ${cur.v.length}/4 · ${r.ps} pass, ${r.fs} miss. Keep the bit going, don't retreat to questions.</div>`);
}

async function showHelp(){
  if(!cur||cur.busy||cur.helpBusy)return;const box=$('#helpbox');
  if(box.innerHTML){box.innerHTML='';return}
  cur.helpBusy=true;box.innerHTML='<div class="card note">Coach is thinking…</div>';
  try{
    const j=await api('/help',{stage:cur.stage,context:cur.ctx,thread:cur.thread,used:A.slice(0,30).map(a=>a.technique).filter(Boolean),exclude:cur.lastHelp||[]});
    cur.help=(cur.help||[]).concat(j.examples.map(e=>e.line));cur.lastHelp=j.examples.map(e=>e.id).filter(Boolean);
    box.innerHTML=`<div class="card"><div class="vh"><span class="k">Coach help</span><button class="btn ghost sm" id="hx" aria-label="Close help">✕</button></div><div style="font-size:14px">${esc(j.tip)}</div>${j.examples.map(e=>`<div class="ex" title="${esc(e.how||'')}"><small>${esc(e.technique)}</small>${esc(e.line)}</div>`).join('')}<p class="note" style="margin-bottom:0">Find your own angle. Copying these lines caps you at Weak.</p></div>`;
    $('#hx').onclick=()=>{box.innerHTML=''};
  }catch(e){box.innerHTML=`<div class="card note">${esc(HINTS[cur.stage])}<br><span class="err">(coach offline: ${esc(e.message)})</span></div>`}
  if(cur)cur.helpBusy=false;
}
$('#hlp').onclick=showHelp;
send.onclick=submit;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
$('#who').onclick=()=>go('#stats');

/* ---------- boot ---------- */
(async()=>{
  try{const c=JSON.parse(ls.get('bc_techs')||'null');if(c)TECHS=c}catch(e){}
  try{const r=await fetch(API+'/techniques');TECHS=(await r.json()).techniques||TECHS;ls.set('bc_techs',JSON.stringify(TECHS))}catch(e){}
  if(TOKEN){
    main.innerHTML='<p class="note">Loading your profile…</p>';
    try{await refresh();}catch(e){
      if(TOKEN){P=null;main.innerHTML=`<div class="card err">Couldn't reach the coach (${esc(e.message)}).</div><div class="row"><button class="btn" id="rty">Retry</button><button class="btn ghost" id="gst">Play as guest</button></div>`;
        $('#rty').onclick=()=>location.reload();$('#gst').onclick=()=>{TOKEN=null;ls.del('bc_token');loadGuest();go('#home');route()};return}
    }
  }else if(ls.get('bc_guest')){loadGuest()}
  if(location.hash==='#play')history.replaceState(null,'','#home');
  route();
})();
</script>
